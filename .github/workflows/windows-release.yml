name: Windows build and release

on:
  push:
    branches:
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve build version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
            if ($version -notmatch '^v\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$') {
              throw "Release tag must look like v1.2.3: $version"
            }
          } else {
            $version = "v0.0.0-preview.$env:GITHUB_RUN_NUMBER"
          }
          $isTag = $env:GITHUB_REF_TYPE -eq 'tag'
          $isPrerelease = $isTag -and ($version -match '^v\d+\.\d+\.\d+-')
          $publishRelease = $isTag -and ($env:GITHUB_REPOSITORY -eq 'tanhua-dev/SeeName' -or $isPrerelease)
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish_release=$($publishRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Read pinned Vulkan and CUDA component versions
        id: backend
        shell: pwsh
        run: |
          $pins = Get-Content scripts/backend-versions.json -Raw | ConvertFrom-Json
          if ($pins.schema -ne 1 -or -not $pins.vulkan -or -not $pins.cuda) { throw 'Invalid scripts/backend-versions.json' }
          "vulkan_version=$($pins.vulkan)" >> $env:GITHUB_OUTPUT
          "cuda_version=$($pins.cuda)" >> $env:GITHUB_OUTPUT

      - name: Reuse published GPU components when pinned versions are available
        id: resolve
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.meta.outputs.publish_release }}
          VULKAN_COMPONENT_VERSION: ${{ steps.backend.outputs.vulkan_version }}
          CUDA_COMPONENT_VERSION: ${{ steps.backend.outputs.cuda_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $resolveArgs = @('--repository', $env:GITHUB_REPOSITORY, '--current-tag', $env:RELEASE_VERSION,
            '--vulkan-version', $env:VULKAN_COMPONENT_VERSION, '--cuda-version', $env:CUDA_COMPONENT_VERSION,
            '--output', 'dist/backends')
          if ($env:PUBLISH_RELEASE -eq 'true') {
            $resolveArgs += @('--download-base-url', "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_VERSION")
          }
          python -B scripts/resolve_backend_assets.py @resolveArgs

      - name: Install Vulkan SDK
        if: steps.resolve.outputs.vulkan_reused != 'true'
        shell: pwsh
        run: |
          $version = '1.4.321.0'
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          $uri = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installation failed: $LASTEXITCODE" }
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path (Join-Path $sdk 'Bin\glslc.exe'))) { throw 'Vulkan SDK glslc.exe was not installed.' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Install CUDA Toolkit 12.4 for the optional CUDA backend
        if: steps.resolve.outputs.cuda_reused != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'

      - name: Enable long Git paths for llama.cpp submodule
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install Ninja for CUDA build
        if: steps.resolve.outputs.cuda_reused != 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }

      - name: Cache CUDA compilation
        uses: ggml-org/ccache-action@v1.2.24
        if: steps.resolve.outputs.cuda_reused != 'true'
        with:
          key: release-windows-2022-x64-cuda-12.4

      - name: Install pinned build dependencies
        shell: pwsh
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF
        run: python -m pip install -r requirements-windows-build.txt

      - name: Build Vulkan component and matching source bundle
        if: steps.resolve.outputs.vulkan_reused != 'true'
        shell: pwsh
        env:
          COMPONENT_VERSION: ${{ steps.backend.outputs.vulkan_version }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.meta.outputs.publish_release }}
        run: |
          $buildArgs = @('--vulkan-sdk', $env:VULKAN_SDK, '--version', $env:COMPONENT_VERSION)
          if ($env:PUBLISH_RELEASE -eq 'true') {
            $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_VERSION"
            $buildArgs += @('--download-base-url', $baseUrl)
          }
          python -B scripts/build_vulkan.py @buildArgs

      - name: Build CUDA component and matching source bundle
        if: steps.resolve.outputs.cuda_reused != 'true'
        shell: cmd
        env:
          COMPONENT_VERSION: ${{ steps.backend.outputs.cuda_version }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.meta.outputs.publish_release }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b %errorlevel%
          if "%PUBLISH_RELEASE%"=="true" (
            python -B scripts/build_cuda.py --version "%COMPONENT_VERSION%" --download-base-url "https://github.com/%GITHUB_REPOSITORY%/releases/download/%RELEASE_VERSION%"
          ) else (
            python -B scripts/build_cuda.py --version "%COMPONENT_VERSION%"
          )

      - name: Build and verify the SeeName application
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $vulkanCatalog = Get-ChildItem dist\backends -Filter 'vulkan-*.catalog.json' | Select-Object -First 1
          $cudaCatalog = Get-ChildItem dist\backends -Filter 'cuda-*.catalog.json' | Select-Object -First 1
          if (-not $vulkanCatalog -or -not $cudaCatalog) { throw 'The Vulkan or CUDA build did not produce a catalog.' }
          python -B scripts/build_windows.py --version $env:RELEASE_VERSION --vulkan-catalog $vulkanCatalog.FullName --cuda-catalog $cudaCatalog.FullName

      - name: Upload preview or release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SeeName-${{ steps.meta.outputs.version }}-${{ github.run_id }}
          path: |
            dist/backends/*
            dist/windows/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.build.outputs.publish_release == 'true'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out tag for release verification
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: SeeName-${{ needs.build.outputs.version }}-${{ github.run_id }}
          path: release-assets

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $files = @(Get-ChildItem release-assets -File -Recurse | ForEach-Object { $_.FullName })
          if ($files.Count -lt 6) { throw "Expected application, Vulkan, source, checksum and catalog assets; found $($files.Count)." }
          foreach ($pattern in @('SeeName-*-windows-x64-cpu.zip', 'vulkan-*.zip', 'vulkan-*.catalog.json', 'vulkan-*-source.zip', 'cuda-*.zip', 'cuda-*.catalog.json', 'cuda-*-source.zip')) {
            if (-not (Get-ChildItem release-assets -File -Recurse -Filter $pattern)) { throw "Missing required release asset matching $pattern." }
          }
          $isPrerelease = $env:RELEASE_VERSION -match '^v\d+\.\d+\.\d+-'
          if ($isPrerelease) {
            gh release create $env:RELEASE_VERSION @files --verify-tag --title "SeeName $env:RELEASE_VERSION" --generate-notes --prerelease
          } else {
            gh release create $env:RELEASE_VERSION @files --verify-tag --title "SeeName $env:RELEASE_VERSION" --generate-notes
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_VERSION" | ConvertFrom-Json
          if ($release.prerelease -ne $isPrerelease) {
            throw "Release prerelease flag is $($release.prerelease), expected $isPrerelease."
          }
